<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sushant Ambekar | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Sushant Ambekar, a full-stack, Android and DevOps developer and CSE student at YCCE Nagpur."
    />
    <meta name="theme-color" content="#070A13" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sushant Ambekar | Portfolio" />
    <meta property="og:description" content="To digitize the mind. Full-stack, Android and DevOps developer." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Runs before first paint so the saved/system theme is applied with no flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F6F4EE' : '#070A13');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
